name: CI

on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install
        run: bun install --frozen-lockfile
      - name: Audit
        run: bun audit --prod --audit-level=high
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test

  # bun test runs on Bun; the server runs on Node.js. The SSRF guard depends
  # on node:http/net internals, so it is checked on every supported version.
  node:
    strategy:
      fail-fast: false
      matrix:
        node:
          - '24'
          - '26'

    name: Guard on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run --filter '@embetty/base...' build
      - name: Test
        run: bun run --filter @embetty/base test:node

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bun fmt --check
      - name: Lint
        run: bun lint --max-warnings=0
      - name: Typecheck
        run: bun run typecheck
